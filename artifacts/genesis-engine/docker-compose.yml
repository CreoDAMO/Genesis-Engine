version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: genesis_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: genesis_neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/genesis_password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_max__size=1G
    restart: unless-stopped

volumes:
  redis_data:
  neo4j_data:
  neo4j_logs:
